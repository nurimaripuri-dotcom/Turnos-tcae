name: Pruebas del rotatorio

# Comprueba el rotatorio de las dos apps: copias cruzadas TCE <-> Enfermeras, forma del cuadrante,
# cálculo de semanas, descanso tras la noche y turnos de referencia del cuadrante de papel.
on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/**', '.github/workflows/tests.yml']
  schedule:
    - cron: '23 6 * * *'   # una vez al día, por si cambia la app de Enfermeras
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: nurimaripuri-dotcom/Turnos-enfermeras
          path: Turnos-enfermeras
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Ejecutar pruebas
        env:
          TCE_HTML: index.html
          ENF_HTML: Turnos-enfermeras/index.html
        run: node --test tests/rotatorio.test.js
