name: Deshacer cambio (puntual)

on:
  push:
    branches: [main]
    paths:
      - 'push-sender/deshacer-cambio.js'

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: push-sender
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-sender/package-lock.json
      - name: Deshacer
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm ci --no-audit --no-fund
          node deshacer-cambio.js
