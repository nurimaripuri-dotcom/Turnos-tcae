name: Vigilancia de la base de datos

# Revisa la base de datos buscando señales de que alguien ha escrito sin pasar por la app.
# Si encuentra algo, la tarea falla y GitHub manda un email a quien la lanzó.
# El registro es público: el script solo imprime tipos de aviso, nodos y recuentos, nunca datos.
on:
  schedule:
    - cron: '17 * * * *'   # cada hora (GitHub puede retrasarlo)
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitor/package-lock.json
      - name: Vigilar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm ci --no-audit --no-fund
          node monitor.js
